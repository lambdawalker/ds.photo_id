<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portrait Studio</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#101820;color:#dce6ed}*{box-sizing:border-box}body{margin:0;padding:20px;max-width:1800px;margin:auto}header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:16px}h1{font-size:22px;margin:0}#connection{color:#91a7b9;margin-right:auto}button{background:#223b4b;color:#e8f5fc;border:1px solid #476178;border-radius:7px;padding:9px 15px;cursor:pointer}button:hover{background:#315466}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #6de2ca}#toggle{background:#6de2ca;color:#10221f;font-weight:700}.workers{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid #39556a;border-radius:10px;overflow:hidden;background:#14212b}.panel-head{padding:16px 18px 12px}h2{font-size:13px;letter-spacing:.1em;color:#6de2ca;margin:0 0 12px}.metrics{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.count{font-size:27px;font-weight:650}.sub{color:#9baebc;font-size:13px}progress{width:100%;height:7px;accent-color:#6de2ca;margin:12px 0}.line{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px}.eta{color:#e8c884}.log{height:clamp(180px,33vh,440px);overflow:auto;background:#0d171f;padding:10px 14px;font:12px/1.65 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid #294152}.log time{color:#7893a5}.explorer{margin-top:24px}.explorer h2{font-size:16px;letter-spacing:0;color:#dce6ed}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{border:1px solid #39556a;border-radius:9px;overflow:hidden;background:#14212b}.card-head{padding:12px;display:flex;justify-content:space-between;gap:8px;font-size:12px}.images{display:grid;grid-template-columns:1fr 1fr;gap:2px}.image{margin:0;min-width:0;background:#21313b}.checker{background-color:#eee;background-image:linear-gradient(45deg,#ccc 25%,transparent 25%),linear-gradient(-45deg,#ccc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ccc 75%),linear-gradient(-45deg,transparent 75%,#ccc 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}img{display:block;width:100%;aspect-ratio:1;object-fit:contain}figcaption{background:#1b2b38;color:#b8cad6;padding:7px;font-size:11px}.pending{aspect-ratio:1;display:grid;place-items:center;color:#dce6ed;font-size:12px;text-align:center;background:#1b2933}details{padding:12px;font-size:12px}summary{cursor:pointer;color:#6de2ca}details p{max-height:180px;overflow:auto;line-height:1.6}.empty{padding:30px;border:1px dashed #39556a;border-radius:8px;color:#9baebc}.error{color:#ffb3a8}a{color:inherit}.status{color:#e8c884}footer{margin-top:16px;color:#7893a5;font-size:12px}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){body{padding:12px}.workers{grid-template-columns:1fr}.log{height:220px}.cards{grid-template-columns:1fr}header{gap:10px}.count{font-size:23px}}
</style>
<header><h1>Portrait Studio</h1><span id="connection" role="status">Connecting…</span><button id="toggle" disabled>Pause</button><button id="retry" disabled>Retry failures</button></header>
<main><section class="workers" aria-label="Processing workers"></section><section class="explorer"><h2>Dataset explorer <span class="sub">· Latest 4 generations</span></h2><div id="cards" class="cards"></div><div id="empty" class="empty">Your latest portraits will appear here as soon as originals are saved.</div></section></main>
<footer>Live updates every second. Open either image to inspect it at full size. Transparent images appear on a checkerboard.</footer>
<script>
const $=s=>document.querySelector(s);let current=null,cardSignature='',busy=false;const lastLog={llm:0,image:0};
for(const [stage,title] of [['llm','01 · PROMPT GENERATION'],['image','02 · IMAGE GENERATION']]){
 const p=document.createElement('article');p.className='panel';p.innerHTML=`<div class="panel-head"><h2>${title}</h2><div class="metrics"><span class="count" id="${stage}-count">0</span><span class="sub" id="${stage}-metrics"></span></div><progress id="${stage}-progress" value="0" max="1"></progress><div class="line"><span id="${stage}-active">Waiting</span><span class="eta" id="${stage}-eta">ETA: measuring…</span></div></div><div class="log" id="${stage}-log" tabindex="0" aria-label="${title} logs"></div>`;$('.workers').append(p);
}
function duration(s){if(s===null)return 'measuring…';s=Math.max(1,Math.ceil(s));if(s<60)return s+'s';let m=Math.ceil(s/60);if(m<60)return m+'m';let h=Math.floor(m/60);return (h>=24?Math.floor(h/24)+'d ':'')+(h%24)+'h '+(m%60)+'m'}
function logs(stage,lines){const el=$('#'+stage+'-log');const stick=el.scrollHeight-el.scrollTop-el.clientHeight<45;for(const entry of lines){if(entry.id<=lastLog[stage])continue;const row=document.createElement('div'),t=document.createElement('time');t.textContent=entry.time+'  ';row.append(t,document.createTextNode(entry.message));el.append(row);lastLog[stage]=entry.id}while(el.childNodes.length>2000)el.firstChild.remove();if(stick)el.scrollTop=el.scrollHeight}
function explorer(items){const sig=JSON.stringify(items);if(sig===cardSignature)return;cardSignature=sig;const open=new Set([...document.querySelectorAll('details[open]')].map(x=>x.dataset.stem));$('#cards').replaceChildren();$('#empty').hidden=items.length>0;for(const item of items){const card=document.createElement('article');card.className='card';const head=document.createElement('div');head.className='card-head';const name=document.createElement('strong'),state=document.createElement('span');name.textContent=item.stem;state.textContent=item.state;state.className='status';head.append(name,state);card.append(head);const images=document.createElement('div');images.className='images';for(const [key,label] of [['original','Original'],['transparent','Transparent']]){const fig=document.createElement('figure');fig.className='image'+(key==='transparent'?' checker':'');if(item[key]){const a=document.createElement('a'),img=document.createElement('img');a.href=item[key];a.target='_blank';a.rel='noopener';img.src=item[key];img.alt=label+' portrait '+item.stem;a.append(img);fig.append(a)}else{const wait=document.createElement('div');wait.className='pending';wait.textContent='Removing background…';fig.append(wait)}const caption=document.createElement('figcaption');caption.textContent=label;fig.append(caption);images.append(fig)}card.append(images);const details=document.createElement('details'),summary=document.createElement('summary'),prompt=document.createElement('p');details.dataset.stem=item.stem;details.open=open.has(item.stem);summary.textContent='Generation prompt';prompt.textContent=item.prompt||'Prompt unavailable';details.append(summary,prompt);card.append(details);if(item.parameters){const link=document.createElement('a');link.href=item.parameters;link.target='_blank';link.rel='noopener';link.textContent='View parameters JSON';link.style.cssText='display:block;padding:0 12px 12px;font-size:12px;color:#6de2ca';card.append(link)}if(item.error){const err=document.createElement('p');err.className='error';err.style.padding='0 12px';err.textContent=item.error;card.append(err)}$('#cards').append(card)}}
async function refresh(){try{const r=await fetch('/api/state');if(!r.ok)throw Error('Dashboard unavailable');const s=await r.json();current=s;$('#connection').textContent=s.status==='complete'?'All portraits complete':s.status==='paused'?'Paused · active requests may still finish':s.status==='stopping'?'Saving and stopping…':'Running · live';$('#toggle').disabled=s.status==='stopping';$('#toggle').textContent=s.status==='paused'?'Resume':'Pause';$('#retry').disabled=!s.failed||s.status==='stopping';for(const stage of ['llm','image']){const n=stage==='llm'?s.prompts:s.done;$('#'+stage+'-count').textContent=n.toLocaleString()+' / '+s.total.toLocaleString();$('#'+stage+'-metrics').textContent=stage==='llm'?`Ready queue ${s.ready}/${s.capacity}`:`Both images · ${s.failed} failures`;$('#'+stage+'-progress').max=s.total;$('#'+stage+'-progress').value=n;$('#'+stage+'-active').textContent=s.active[stage]?'Working: '+s.active[stage]:(n===s.total?'Complete':s.status==='paused'?'Paused':'Waiting for work');$('#'+stage+'-eta').textContent=(s.status==='paused'?'On resume: ':'ETA: ')+(n===s.total?'complete':duration(s.eta[stage]));logs(stage,s.logs[stage])}explorer(s.latest)}catch(e){$('#connection').textContent='Disconnected · reconnecting…';$('#toggle').disabled=true;$('#retry').disabled=true}finally{setTimeout(refresh,1000)}}
async function action(name){if(busy)return;busy=true;$('#toggle').disabled=true;$('#retry').disabled=true;try{const r=await fetch('/api/'+name,{method:'POST',headers:{'X-Dashboard':'1'}});if(!r.ok)throw Error('Control failed');$('#connection').textContent='Updating…'}catch(e){$('#connection').textContent=e.message}finally{busy=false}}
$('#toggle').onclick=()=>current&&action(current.status==='paused'?'resume':'pause');$('#retry').onclick=()=>action('retry');refresh();
</script></html>
