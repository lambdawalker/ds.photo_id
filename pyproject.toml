[project]
name = "ds-photo-id"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "datasets>=5.2.0",
    "filelock>=4.1.0",
    "huggingface-hub>=2.4.0",
    "jinja2",
    "pillow>=12.3.0",
    "pyyaml",
    "textual>=8.2.8",
]

[project.optional-dependencies]
publish = [
    "datasets",
    "huggingface-hub",
    "pillow",
]

[tool.uv]
package = false
