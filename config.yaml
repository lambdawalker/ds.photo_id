comfyui:
  url: http://192.168.1.186:8188
  timeout_seconds: 600

llm:
  enabled: true
  url: http://127.0.0.1:1234/v1
  api: lmstudio
  model: google/gemma-4-12b-qat
  timeout_seconds: 20

generation:
  samples: 10000
  seed: 42
  output_dir: dataset/idPhoto
  prompt_queue_size: null
  retries:
    enabled: true
    max_retries: 3
    initial_delay_seconds: 10
    max_delay_seconds: 120
  image_storage:
    format: webp
    quality: 90
    lossless: false

web:
  enabled: true
  host: 127.0.0.1
  port: 8765

huggingface:
  enabled: true
  repo_id: lambdaWalker/ds.photo-id
  private: true
  batch_size: 10
  interval_seconds: 300
  retry_seconds: 60
